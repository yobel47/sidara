name: Deploy Laravel
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/sidara
            
            # Pastikan kepemilikan folder benar
            sudo chown -R $USER:$USER /var/www/sidara
            
            # Pastikan Git aman
            git config --global --add safe.directory /var/www/sidara
            
            # Reset paksa ke kondisi di GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Build & Restart Docker
            docker compose build
            docker compose up -d
